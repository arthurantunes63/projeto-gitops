apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  source:
    repoURL: 'https://github.com/arthurantunes63/projeto-gitops'
    path: k8s
    targetRevision: HEAD
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true